<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>充电桩运营数据大屏</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <main>
    <header><h1>充电桩运营数据大屏</h1><span id="clock"></span></header>
    <section class="metrics">
      <article><small>今日营收</small><strong>¥ 0.00</strong></article>
      <article><small>在线电桩</small><strong>0</strong></article>
      <article><small>进行中订单</small><strong>0</strong></article>
    </section>
    <section class="grid">
      <article class="panel"><h2>近 7 日营收</h2><div id="revenue" class="chart"></div></article>
      <article class="panel"><h2>电桩状态</h2><div id="status" class="chart"></div></article>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
